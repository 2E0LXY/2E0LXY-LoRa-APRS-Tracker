name: Build & Release

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Build firmware
        run: pio run -e t-deck-plus

      - name: Rename binary
        run: |
          mkdir -p dist
          cp .pio/build/t-deck-plus/firmware.bin dist/2E0LXY-TDeck-Plus-firmware.bin
          cp .pio/build/t-deck-plus/firmware.elf dist/2E0LXY-TDeck-Plus-firmware.elf 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ## 2E0LXY LoRa APRS Tracker — ${{ github.ref_name }}

            **Hardware:** LilyGO T-Deck Plus (ESP32-S3)
            **Frequency:** 439.9125 MHz (UK LoRa APRS)
            **APRS-IS:** www.aprsnet.uk:14580

            ### Flash
            ```
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 \
              --baud 921600 write_flash 0x0 2E0LXY-TDeck-Plus-firmware.bin
            ```
            Or use the [2E0LXY web installer](https://2e0lxy.github.io/2E0LXY-LoRa-APRS-Tracker/)
