name: Build & Release

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Stamp FW_VERSION from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"${VER}\"/" include/board_pins.h
          echo "Stamped FW_VERSION=${VER}"
          grep FW_VERSION include/board_pins.h

      - name: Build firmware
        run: pio run -e t-deck-plus

      - name: Create full-flash image (bootloader + partitions + app)
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/t-deck-plus"
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"
          mkdir -p dist
          cp "$BUILD/firmware.bin" dist/2E0LXY-TDeck-Plus-firmware.bin
          cp "$BUILD/firmware.elf" dist/2E0LXY-TDeck-Plus-firmware.elf 2>/dev/null || true
          # T-Deck Plus = ESP32-S3, 16MB flash, bootloader at 0x0 (no 0x1000
          # offset - that's only for classic ESP32). This merged image can be
          # safely written starting at 0x0 with a full chip erase, unlike the
          # app-only firmware.bin above which REQUIRES an existing bootloader.
          python "$ESPTOOL" --chip esp32s3 merge_bin \
            -o dist/2E0LXY-TDeck-Plus-full-flash.bin \
            --flash_mode qio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0000  "$BUILD/bootloader.bin" \
            0x8000  "$BUILD/partitions.bin" \
            0xe000  "$FRAMEWORK/tools/partitions/boot_app0.bin" \
            0x10000 "$BUILD/firmware.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ## 2E0LXY LoRa APRS Tracker — ${{ github.ref_name }}

            **Hardware:** LilyGO T-Deck Plus (ESP32-S3)
            **Frequency:** 439.9125 MHz (UK LoRa APRS)
            **APRS-IS:** www.aprsnet.uk:14580

            ### Flash
            ```
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 \
              --baud 921600 write_flash 0x0 2E0LXY-TDeck-Plus-firmware.bin
            ```
            Or use the [2E0LXY web installer](https://2e0lxy.github.io/2E0LXY-LoRa-APRS-Tracker/)
