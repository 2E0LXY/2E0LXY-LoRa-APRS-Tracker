; 2E0LXY LoRa APRS Tracker — LilyGO T-Deck Plus
; https://github.com/2E0LXY/2E0LXY-LoRa-APRS-Tracker

[platformio]
default_envs = t-deck-plus

[env:t-deck-plus]
platform             = espressif32 @ 6.9.0
board                = T-Deck
framework            = arduino
board_build.partitions = partitions_16MB.csv
upload_speed         = 921600
monitor_speed        = 115200
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; TFT_eSPI — LilyGO T-Deck Plus ST7789 320x240, shared SPI bus
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    ; Arduino-ESP32 core ~2.0.15+ mis-resolves TFT_eSPI's default SPI_PORT
    ; on ESP32-S3, crashing with StoreProhibited/EXCVADDR 0x10 in
    ; begin_tft_write() on the very first register write. Forcing
    ; USE_HSPI_PORT selects a port constant that resolves correctly on
    ; this core version. See Bodmer/TFT_eSPI#3329 and #3488.
    -D USE_HSPI_PORT=1
    ; Fixes garbage/uncleared pixels on the right-hand columns after
    ; rotation on some ST7789 panel batches — the driver's default GRAM
    ; addressing window doesn't match this panel without the extra
    ; rotation offsets CGRAM_OFFSET enables. See Bodmer/TFT_eSPI#1793,
    ; #1473, #3804.
    -D CGRAM_OFFSET=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MISO=38
    -D TFT_MOSI=41
    -D TFT_SCLK=40
    -D TFT_CS=12
    -D TFT_DC=11
    -D TFT_RST=-1
    -D TFT_BL=42
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; RadioLib — exclude all unused protocols (same as iGate firmware)
    -D RADIOLIB_EXCLUDE_CC1101=1
    -D RADIOLIB_EXCLUDE_RF69=1
    -D RADIOLIB_EXCLUDE_RFM2X=1
    -D RADIOLIB_EXCLUDE_SX1231=1
    -D RADIOLIB_EXCLUDE_SI443X=1
    -D RADIOLIB_EXCLUDE_NRF24=1
    -D RADIOLIB_EXCLUDE_AFSK=1
    -D RADIOLIB_EXCLUDE_APRS=1
    -D RADIOLIB_EXCLUDE_AX25=1
    -D RADIOLIB_EXCLUDE_BELL=1
    -D RADIOLIB_EXCLUDE_FSK4=1
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
    -D RADIOLIB_EXCLUDE_LORAWAN=1
    -D RADIOLIB_EXCLUDE_MORSE=1
    -D RADIOLIB_EXCLUDE_PAGER=1
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
    -D RADIOLIB_EXCLUDE_RTTY=1
    -D RADIOLIB_EXCLUDE_SSTV=1
    -Os

lib_deps =
    jgromes/RadioLib @ 7.6.0
    mikalhart/TinyGPSPlus @ 1.0.3
    bblanchon/ArduinoJson @ 7.2.1
    knolleary/PubSubClient @ 2.8
    bodmer/TFT_eSPI @ 2.5.43
    bodmer/TJpg_Decoder @ 1.1.0
    adafruit/Adafruit BME280 Library @ 2.2.4
    adafruit/Adafruit Unified Sensor @ 1.1.14
    h2zero/NimBLE-Arduino @ 1.4.2
    bitbank2/PNGdec @ 1.1.6
    ; WebSockets is vendored in lib/WebSockets (not fetched from the
    ; registry) so its library.json can be patched — see platformio.ini's
    ; lib_ldf_mode note below for why.

; NOTE: was chain+ — the WebSockets library (and its transitive Ethernet/
; WiFiClientSecure framework deps) can't resolve <WiFi.h> at all in "+"
; mode, a confirmed unresolved upstream PlatformIO/LDF bug (see
; github.com/platformio/platformio-core/issues/3876). Plain chain mode
; is the documented workaround and still walks the full dependency graph
; (just without deep+'s more aggressive nested-library scanning), so this
; should be safe for the rest of the project's libraries too.
lib_ldf_mode = chain
